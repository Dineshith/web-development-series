<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>css-basics</title>
</head>
<body>
  

<style>
  .subscribe-btn{
    background-color: rgb(200, 0, 0 );
    color: white;
    border:none;
    height: 36px;
    width: 105px;
    border-radius: 2px;
    cursor: pointer;
    margin-right:8px;
  }

  .join-btn{
    background-color: white;
    border-color: rgb(41, 118, 211);
    border-style: solid;
    border-width: 1px;
    color: rgb(41, 118, 211);
    height: 36px;
    width: 62px;
    border-radius: 2px;
    cursor: pointer;
    

  }
  .tweet-button{
    background-color: rgb(2, 158,255 );
    color: white;
    border: none;
    height: 36px;
    width: 70px;
    border-radius: 18px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    margin-left: 8px;


  }
</style>




<button class="subscribe-btn">
  Subscribe</button>


<button class="join-btn">
  JOIN</button>


<button class="tweet-button">Tweet</button>

</body>
</html>
