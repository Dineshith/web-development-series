<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise4k.html </title>
  <style>
    .stretch-btn{
      background-color: green;
      border: none;
      font-size: 14px;
      color: white;
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 13px;
      padding-right: 13px;
      margin-top: 7px;
      margin-bottom: 7px;
      margin-left: 7px;
      margin-right: 7px;
      cursor: pointer;
      transition: padding 0.15s, margin 0.15s;

    }
    .stretch-btn:hover{
      padding-left:25px;
      padding-right:25px;
      margin-left: 0px;
      margin-right: 0px;

    }
  </style>
</head>
<body>


  <button class="stretch-btn">One</button>
  <button class="stretch-btn">Two</button>
  <button class="stretch-btn">Three</button>
</body>
</html>
