<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>exercise 2d- Bootstrap</title>
  </head>
  <body>
    <style>
      .getstarted-button {
        background-color: rgb(121, 82, 179);
        color: aliceblue;
        border: none;
        border-radius: 3px;
        padding-left: 15px;
        padding-right: 15px;
        padding-top: 8px;
        padding-bottom: 8px;
        font-weight: bold;
        font-size: 13px;
        margin-left: 5px;
        cursor: pointer;
      }

      .download-button {
        background-color: white;
        color: rgb(108, 117, 125);
        border: none;
        padding-left: 15px;
        padding-right: 15px;
        padding-top: 8px;
        padding-bottom: 8px;
        border-radius: 3px;
        cursor: pointer;
      }
      .download-button:hover{
        background-color:grey;

      }
    </style>

    <button class="getstarted-button">Get started</button>

    <button class="download-button">Download</button>
  </body>
</html>
